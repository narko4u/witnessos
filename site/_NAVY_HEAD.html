<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is WitnessOS?","acceptedAnswer":{"@type":"Answer","text":"WitnessOS is the runtime governance layer for autonomous agents, developed by Empire Labs Pty Ltd. It sits between an agent wanting to act and the agent being allowed to act, applying deterministic policy, human approval and tamper-evident evidence to every governed action."}},{"@type":"Question","name":"What is an agent transaction?","acceptedAnswer":{"@type":"Answer","text":"An agent transaction is any governed action an autonomous agent performs, such as a payment, refund or message. WitnessOS records each one as a signed, chained evidence receipt with an independent timestamp, so the transaction can be verified later without trusting the operator."}},{"@type":"Question","name":"How does WitnessOS handle AI commerce and payments?","acceptedAnswer":{"@type":"Answer","text":"WitnessOS governs payment and commerce actions through connectors, including x402 payments, Stripe refunds and messaging. Evidence receipts are produced before a connector runs, giving AI commerce the audit trail it needs: what was spent, who approved it, and proof the record was not altered."}},{"@type":"Question","name":"What does E4 evidence mean?","acceptedAnswer":{"@type":"Answer","text":"E4 is the top grade on the public WitnessOS evidence ladder. It means the receipt was independently timestamped by an RFC 3161 Time Stamping Authority with revocation checked at record time, and it re-verifies offline with zero trust in Empire Labs."}},{"@type":"Question","name":"Is WitnessOS an agent operating system?","acceptedAnswer":{"@type":"Answer","text":"No. WitnessOS is not an operating system for machines. It is the operating layer for governed agent action, the kernel between the agent wants to and the agent may. It governs, approves and proves actions rather than running the agent itself."}}]}</script>
<style>
:root{color-scheme:dark;--floor:20px;--bg:#07101d;--panel:#0d1a2b;--line:#23415f;--text:#f4f8ff;--muted:#a8bbce;--accent:#55c7ff;--good:#7ce7c0;--max:1180px}

.mobile{display:none}
