# Agent Type: Code Assistant
# AI-powered coding agent that generates, reviews, and refactors source code.
# Integrates with IDEs, version control systems, and CI/CD pipelines.

id: code-assistant
name: Code Assistant
description: >
  An AI-powered coding agent that assists developers with software development
  tasks including code generation, review, debugging, refactoring, and
  documentation. These agents integrate with IDEs via extensions, with version
  control systems through pull request reviews, and with CI/CD pipelines for
  automated code quality checks. Advanced implementations can operate on entire
  codebases, understand project structure, and make cross-file modifications.
category: general-purpose
vendor: anthropic-tool-use
capabilities:
  - Source code generation from natural language descriptions
  - Code review and vulnerability detection
  - Automated refactoring and optimization
  - Test generation and execution
  - Documentation generation
  - Multi-language support (Python, JavaScript, TypeScript, Go, Rust, etc.)
  - Git integration for PR reviews and commit messages
  - Codebase-wide context understanding
risk_profile: medium
known_behaviors:
  - pattern: Insecure code generation
    severity: high
    description: >
      Code assistants may generate code with security vulnerabilities such as
      SQL injection, command injection, or hardcoded credentials if not properly
      constrained. The agent lacks awareness of production security context.
  - pattern: License compliance gaps
    severity: medium
    description: >
      Generated code may inadvertently reproduce copyrighted or restrictively
      licensed code snippets. The agent may not track or disclose license
      provenance of generated outputs.
  - pattern: Large-scale unwanted modifications
    severity: medium
    description: >
      When given broad modification authority, code assistants can introduce
      cascading changes across a codebase that are difficult to review or
      revert, especially when operating without human-in-the-loop approval.
  - pattern: Over-reliance on cached context
    severity: low
    description: >
      Agents may operate on stale or incomplete context, leading to
      modifications that conflict with recent changes or project conventions.
detection_signatures:
  - "ide_plugin: specific extension IDs (e.g., 'github.copilot', 'Continue.continue')"
  - "api_endpoint: /v1/complete or code generation endpoints with prompt/response pattern"
  - "behavior: rapid series of file writes with generated code markers (<!-- generated by -->)"
  - "traffic_pattern: high outbound token usage to LLM inference APIs from developer workstations"
  - "process_name: 'copilot', 'codex', 'continue', or custom agent processes in IDE plugins"
first_seen: "2021-06-29"
references:
  - "https://github.com/features/copilot"
  - "https://docs.anthropic.com/en/docs/claude-code"
  - "https://continue.dev/"
  - "https://arxiv.org/abs/2406.03831"
