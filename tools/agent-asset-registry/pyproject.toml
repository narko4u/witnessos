[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "witnessos-agent-asset-registry"
version = "0.1.0"
description = "Community-driven catalog of known AI agent types"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[tool.setuptools.packages.find]
include = ["schema", "schema.*", "registry", "registry.*"]

[project.urls]
Homepage = "https://github.com/narko4u/witnessos-agent-asset-registry"
