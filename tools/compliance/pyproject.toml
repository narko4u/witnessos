[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "witnessos-compliance"
version = "0.1.0"
description = "WitnessOS Compliance Pack — CLI for NSA MCP and EU AI Act compliance reports"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "rich>=13.0",
]

[project.scripts]
witnessos-compliance = "witnessos_cli.main:cli"

[tool.setuptools.packages.find]
include = ["witnessos_cli", "witnessos_cli.*"]
where = ["cli"]
