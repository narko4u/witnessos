[project]
name = "witnessos-sdk"
version = "0.1.0"
description = "Python SDK for WitnessOS - the credential-brokered enforcement gateway for autonomous AI agents"
authors = [{ name = "Empire Labs Pty Ltd", email = "contact@empirelabs.com.au" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
]

[project.urls]
"Homepage" = "https://github.com/narko4u/witnessos"
"Documentation" = "https://witnessos.ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
