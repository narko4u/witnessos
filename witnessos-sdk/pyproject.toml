[project]
name = "witnessos-sdk"
version = "0.1.2"
description = "Python SDK for WitnessOS - the credential-brokered enforcement gateway for autonomous AI agents"
authors = [{ name = "Empire Labs Pty Ltd", email = "contact@empirelabs.com.au" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
]

[project.urls]
"Homepage" = "https://github.com/narko4u/witnessos"
"Documentation" = "https://witnessos.com.au"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The package lives under src/. Package discovery is declared explicitly because
# hatchling read this repo's VCS ignore context and produced a wheel containing
# only dist-info: installation "succeeded" and the import failed. A build that
# ships no modules must not be possible, and tests/test_packaging.py proves it
# is not by building a wheel and requiring the modules inside it.
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["witnessos_sdk*"]
