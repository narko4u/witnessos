<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11161c">
<meta name="description" content="Local-first test and tag register">
<title>Test register</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
  :root { color-scheme: dark; --bg:#11161c; --panel:#1a222b; --line:#2a3542; --ink:#e8eef5;
          --mute:#93a2b3; --ok:#3ddc84; --warn:#ffb020; --bad:#ff5c5c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line);
           padding:10px 14px; z-index:5; }
  h1 { font-size:15px; margin:0 0 4px; letter-spacing:.02em; text-transform:uppercase; color:var(--mute); }
  .stats { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--mute); }
  .net { font-weight:700; }
  .net.up { color:var(--ok); } .net.down { color:var(--warn); }
  main { padding:12px 14px 120px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  label { display:block; font-size:12px; color:var(--mute); margin:8px 0 4px; text-transform:uppercase;
          letter-spacing:.04em; }
  input, select, button, textarea { font:inherit; width:100%; border-radius:10px; }
  input, select, textarea { background:#0e141a; color:var(--ink); border:1px solid var(--line);
                            padding:12px; min-height:46px; }
  input#tag { font-size:20px; font-weight:700; letter-spacing:.03em; }
  button { border:1px solid var(--line); background:#22303d; color:var(--ink); padding:12px;
           min-height:46px; cursor:pointer; }
  button:active { transform:translateY(1px); }
  .big { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .big button { min-height:74px; font-size:20px; font-weight:800; letter-spacing:.03em; border-width:2px; }
  #pass { border-color:var(--ok); color:var(--ok); }
  #fail { border-color:var(--bad); color:var(--bad); }
  .row { display:grid; grid-template-columns:76px 1fr auto; gap:8px; align-items:center;
         padding:10px 6px; border-bottom:1px solid var(--line); list-style:none; }
  .row.empty { display:block; color:var(--mute); }
  .tag { font-family: ui-monospace, monospace; font-size:13px; color:var(--mute); }
  .desc { font-size:14px; } .loc { display:block; font-size:11px; color:var(--mute); }
  .due { text-align:right; font-size:12px; font-family:ui-monospace, monospace; }
  .pill { display:block; font-size:10px; font-weight:800; margin-top:2px; }
  .s-overdue .pill { color:var(--bad); } .s-due_soon .pill { color:var(--warn); }
  .s-current .pill { color:var(--ok); } .s-untested .pill { color:var(--mute); }
  ul#items { margin:0; padding:0; }
  .banner { position:fixed; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom));
            padding:12px; border-radius:10px; background:#22303d; border:1px solid var(--line);
            font-size:14px; z-index:20; }
  .banner.ok { border-color:var(--ok); } .banner.bad { border-color:var(--bad); }
  .banner.warn { border-color:var(--warn); }
  .banner.hidden { display:none; }
  #video { width:100%; border-radius:10px; background:#000; }
  .hidden { display:none; }
  .tools { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .tools button { font-size:13px; }
  .hint { font-size:11px; color:var(--mute); margin-top:6px; }
  #conflicts { color:var(--warn); font-weight:700; }
</style>
</head>
<body>
<header>
  <h1>Test register</h1>
  <div class="stats">
    <span id="counts">0 items</span>
    <span id="outbox">0 records</span>
    <span id="net" class="net">offline ready</span>
    <span id="conflicts"></span>
  </div>
</header>

<main>
  <div class="card">
    <label for="tag">Tag or asset id</label>
    <input id="tag" inputmode="text" autocomplete="off" autocapitalize="characters"
           placeholder="Scan or type" enterkeyhint="go">
    <div class="tools">
      <button id="scan" type="button">Scan tag</button>
      <button id="scanstop" type="button" class="hidden">Stop camera</button>
    </div>
    <video id="video" class="hidden" playsinline muted></video>

    <label for="class">Environment class</label>
    <select id="class"></select>

    <label for="tested">Tested on</label>
    <input id="tested" type="date">

    <label for="note">Note (optional)</label>
    <textarea id="note" rows="2" placeholder="Only if something needs explaining"></textarea>

    <div class="big">
      <button id="pass" type="button">PASS</button>
      <button id="fail" type="button">FAIL</button>
    </div>
    <p class="hint">The record is written to this device before the button stops moving.
      Nothing is sent anywhere until you export.</p>
  </div>

  <div class="card">
    <ul id="items"></ul>
    <p class="hint">Due dates come from the environment class and are recalculated from the
      record, never typed by hand.</p>
  </div>

  <div class="card">
    <label>Register</label>
    <div class="tools">
      <button id="importbtn" type="button" onclick="document.getElementById('import').click()">Import CSV</button>
      <button id="export" type="button">Export CSV</button>
    </div>
    <div class="tools">
      <button id="template" type="button">Blank template</button>
    </div>
    <input id="import" type="file" accept=".csv,text/csv" class="hidden">
  </div>
</main>

<div id="banner" class="banner hidden"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
